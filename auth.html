<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Multi-Auth Secure</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; margin: 0; padding: 0; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container { max-width: 450px; width: 100%; padding: 35px; background: #1e1e1e; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #333; box-sizing: border-box; text-align: center; position: relative; }
        .logo { color: #ffcc00; margin: 0 0 5px 0; font-size: 36px; font-weight: 800; }
        .subtitle { color: #777; margin: 0 0 25px 0; font-size: 14px; }
        
        /* 🌐 LANGUAGE SWITCHER SYSTEM */
        .lang-container { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 20px; width: 100%; }
        .lang-btn { background: #2b2b2b; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .lang-btn.active { background: #ffcc00; color: #111; border-color: #ffcc00; }

        /* 🎛️ TAB BUTTONS */
        .form-toggle { display: flex; justify-content: space-between; margin-bottom: 25px; background: #252525; padding: 5px; border-radius: 10px; border: 1px solid #333; }
        .tab-btn { width: 50%; padding: 12px; font-weight: bold; cursor: pointer; border: none; background: transparent; border-radius: 8px; font-size: 14px; color: #aaa; transition: 0.2s; }
        .tab-btn.active { background: #ffcc00; color: #111; }

        /* 📋 INPUT FIELDS */
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #ffcc00; font-size: 13px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #2b2b2b; color: #fff; outline: none; }
        
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #111; background-color: #ffcc00; margin-top: 10px; }
        .divider { display: flex; align-items: center; text-align: center; color: #555; margin: 25px 0; font-size: 12px; font-weight: bold; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        
        .social-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; background: #df4a32; transition: 0.2s; }
        .social-btn:hover { opacity: 0.9; }

        /* 🙋‍♂️ ROLE SELECTOR */
        .role-area { display: none; margin-top: 15px; text-align: left; }
        .role-selector { display: flex; justify-content: space-between; gap: 15px; margin: 10px 0 20px 0; }
        .role-box { width: 50%; padding: 15px 10px; border: 2px solid #444; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; background: #2b2b2b; color: #aaa; text-align: center; }
        .role-box.active { border-color: #ffcc00; background: #221f15; color: #ffcc00; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="lang-container">
            <button id="lang-si" class="lang-btn active" onclick="changeLanguage('si')">සිංහල</button>
            <button id="lang-en" class="lang-btn" onclick="changeLanguage('en')">English</button>
            <button id="lang-ta" class="lang-btn" onclick="changeLanguage('ta')">தமிழ்</button>
        </div>

        <h1 class="logo">QuickFix</h1>
        <p class="subtitle" id="mainSubtitle">ඔබේ ගිණුමට ඇතුල් වන්න හෝ අලුතින් සාදන්න</p>

        <div class="form-toggle" id="tabBar">
            <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="signupTab" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="mainAuthForm">
            <div id="signupFields" class="hidden">
                <div class="input-group">
                    <label id="lblFullName">ඔබේ සම්පූර්ණ නම</label>
                    <input type="text" id="authName" placeholder="Kamal Perera">
                </div>
            </div>

            <div class="input-group" id="phoneContainerSignUpOnly">
                <label id="lblPhone">දුරකථන අංකය</label>
                <input type="tel" id="authPhone" placeholder="07XXXXXXXX" required>
            </div>

            <div class="input-group" id="identifierContainer">
                <label id="identifierLabel">ඊමේල් හෝ දුරකථන අංකය</label>
                <input type="text" id="authIdentifier" placeholder="example@gmail.com / 07XXXXXXXX" required>
            </div>
            
            <div class="input-group" id="passwordContainer">
                <label id="lblPassword">මුරපදය</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>

            <div id="roleArea" class="role-area">
                <label style="color: #ffcc00; font-weight: bold;" id="lblSelectRole">ඔබේ භූමිකාව තෝරන්න (Select Role):</label>
                <div class="role-selector">
                    <div id="roleCust" class="role-box active" onclick="selectRole('customer')">🙋‍♂️ <span id="lblRoleCust">කස්ටමර්</span></div>
                    <div id="roleSupp" class="role-box" onclick="selectRole('supplier')">🛠️ <span id="lblRoleSupp">රයිඩර්</span></div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ඇතුල් වන්න</button>
        </form>

        <div id="socialDiv">
            <div class="divider" id="lblDivider">නැතහොත් වෙනත් ක්‍රමයකින්</div>
            <button class="social-btn" id="lblGoogleBtn" onclick="loginWithGoogle()">🌐 Continue with Google</button>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq"; const part2 = "_v--pAOOfI";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "quickfix-new.firebaseapp.com", projectId: "quickfix-new", storageBucket: "quickfix-new.firebasestorage.app", messagingSenderId: "316535009311", appId: "1:316535009311:web:975f6b2b89604447c0e52a" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let currentTab = 'login', chosenRole = 'customer', googleUserObj = null, currentLang = 'si';

        const translations = {
            si: { subtitle: "ඔබේ ආරක්ෂිත ගිණුමට ලොග් වන්න", step2: "ගිණුම සක්‍රීය කිරීමට අවසාන පියවර (දුරකථන අංකය අනිවාර්යයි)", fullName: "සම්පූර්ණ නම", phone: "දුරකථන අංකය", pass: "මුරපදය", selectRole: "ඔබේ භූමිකාව තෝරන්න:", customer: "කස්ටමර්", supplier: "රයිඩර්", loginBtn: "ඇතුල් වන්න", signupBtn: "ගිණුම සාදන්න", finishBtn: "ලියාපදිංචිය අවසන් කරන්න", emailOrPhone: "ඊමේල් හෝ දුරකථන අංකය", emailOnly: "ඊමේල් ලිපිනය (Email)", divider: "නැතහොත් වෙනත් ක්‍රමයකින්", google: "🌐 Continue with Google" },
            en: { subtitle: "Login to your secure account", step2: "Final step to activate account (Phone Number Required)", fullName: "Full Name", phone: "Phone Number", pass: "Password", selectRole: "Select Your Role:", customer: "Customer", supplier: "Rider", loginBtn: "Login", signupBtn: "Sign Up", finishBtn: "Complete Registration", emailOrPhone: "Email or Phone Number", emailOnly: "Email Address", divider: "Or via other methods", google: "🌐 Continue with Google" },
            ta: { subtitle: "உங்கள் பாதுகாப்பான கணக்கில் உள்நுழையவும்", step2: "கணக்கை செயல்படுத்த இறுதி படி (தொலைபேசி எண் கட்டாயம்)", fullName: "முழு பெயர்", phone: "தொலைபேசி எண்", pass: "கடவுச்சொல்", selectRole: "உங்கள் பாத்திரத்தை தேர்வு செய்யவும்:", customer: "வாடிக்கையாளர்", supplier: "ரைடர்", loginBtn: "உள்நுழைக", signupBtn: "பதிவு செய்க", finishBtn: "பதிவை முடிக்கவும்", emailOrPhone: "மின்னஞ்சல் அல்லது தொலைபேசி", emailOnly: "மின்னஞ்சல் முகவரி", divider: "அல்லது வேறு வழிகள் மூலம்", google: "🌐 கூகிள் மூலம் தொடரவும்" }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`lang-${lang}`).classList.add('active');
            
            document.getElementById('lblFullName').innerText = translations[lang].fullName;
            document.getElementById('lblPhone').innerText = translations[lang].phone;
            document.getElementById('lblPassword').innerText = translations[lang].pass;
            document.getElementById('lblSelectRole').innerText = translations[lang].selectRole;
            document.getElementById('lblRoleCust').innerText = translations[lang].customer;
            document.getElementById('lblRoleSupp').innerText = translations[lang].supplier;
            document.getElementById('lblDivider').innerText = translations[lang].divider;
            document.getElementById('lblGoogleBtn').innerText = translations[lang].google;
            
            if(currentTab === 'login') {
                document.getElementById('mainSubtitle').innerText = translations[lang].subtitle;
                document.getElementById('submitBtn').innerText = translations[lang].loginBtn;
                document.getElementById('identifierLabel').innerText = translations[lang].emailOrPhone;
            } else if(currentTab === 'signup') {
                document.getElementById('mainSubtitle').innerText = translations[lang].subtitle;
                document.getElementById('submitBtn').innerText = translations[lang].signupBtn;
                document.getElementById('identifierLabel').innerText = translations[lang].emailOnly;
            } else {
                document.getElementById('mainSubtitle').innerText = translations[lang].step2;
                document.getElementById('submitBtn').innerText = translations[lang].finishBtn;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('mainAuthForm').reset();
            document.getElementById('roleArea').style.display = 'none';
            document.getElementById('identifierContainer').style.display = 'block';
            document.getElementById('passwordContainer').style.display = 'block';
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('signupTab').classList.remove('active');
                document.getElementById('signupFields').classList.add('hidden');
                document.getElementById('phoneContainerSignUpOnly').style.display = 'none'; // Login එකේදී මේක ඕන නෑ
                document.getElementById('authPhone').removeAttribute('required');
                document.getElementById('socialDiv').style.display = 'block';
            } else {
                document.getElementById('signupTab').classList.add('active');
                document.getElementById('loginTab').classList.remove('active');
                document.getElementById('signupFields').classList.remove('hidden');
                document.getElementById('phoneContainerSignUpOnly').style.display = 'block'; // Signup එකේදී අනිවාර්යයි
                document.getElementById('authPhone').setAttribute('required', 'required');
                document.getElementById('roleArea').style.display = 'block';
            }
            changeLanguage(currentLang);
        }
        
        switchTab('login'); // Default View Setup

        function selectRole(role) {
            chosenRole = role;
            document.getElementById('roleCust').classList.remove('active');
            document.getElementById('roleSupp').classList.remove('active');
            if (role === 'customer') document.getElementById('roleCust').classList.add('active');
            else document.getElementById('roleSupp').classList.add('active');
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                googleUserObj = result.user;
                db.collection("users").doc(googleUserObj.uid).get().then((doc) => {
                    if (doc.exists) {
                        redirectUser(doc.data().role);
                    } else {
                        // 🚨 🆕 GOOGLE වලින් එන අලුත් යූසර්ට PHONE NUMBER එක ගහන්නම ස්ක්‍රීන් එක හදනවා!
                        document.getElementById('tabBar').classList.add('hidden');
                        document.getElementById('socialDiv').style.display = 'none';
                        document.getElementById('signupFields').classList.add('hidden');
                        document.getElementById('identifierContainer').style.display = 'none';
                        document.getElementById('passwordContainer').style.display = 'none';
                        
                        // ෆෝන් නම්බර් එකයි, රෝල් එකයි විතරක් පෙන්වනවා
                        document.getElementById('phoneContainerSignUpOnly').style.display = 'block';
                        document.getElementById('authPhone').setAttribute('required', 'required');
                        document.getElementById('roleArea').style.display = 'block';
                        
                        currentTab = 'google-new-role';
                        changeLanguage(currentLang);
                    }
                });
            }).catch((error) => { alert("Google Login Failed: " + error.message); });
        }

        document.getElementById('mainAuthForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let identifier = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value;
            const phone = document.getElementById('authPhone').value.trim();

            if (currentTab === 'signup') {
                const name = document.getElementById('authName').value;
                if(!identifier.includes("@")) { alert("Enter valid email!"); return; }
                if(!phone || phone.length < 9) { alert("කරුණාකර නිවැරදි දුරකථන අංකයක් ඇතුළත් කරන්න!"); return; }

                auth.createUserWithEmailAndPassword(identifier, password).then((cred) => {
                    return db.collection("users").doc(cred.user.uid).set({
                        fullName: name, email: identifier, phoneNumber: phone, role: chosenRole,
                        avatar: "https://www.w3schools.com/howto/img_avatar.png",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }).then(() => {
                    alert("✅ Success! Please Login now.");
                    switchTab('login');
                }).catch(err => alert("Error: " + err.message));

            } else if (currentTab === 'google-new-role') {
                // 🚨 GOOGLE අලුත් යූසර් ෆෝන් නම්බර් එක ගැහුවද බලනවා
                if(!phone || phone.length < 9) { alert("කරුණාකර දුරකථන අංකයක් ඇතුළත් කරන්න!"); return; }

                db.collection("users").doc(googleUserObj.uid).set({
                    fullName: googleUserObj.displayName, email: googleUserObj.email, phoneNumber: phone, role: chosenRole,
                    avatar: googleUserObj.photoURL || "https://www.w3schools.com/howto/img_avatar.png",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => { redirectUser(chosenRole); });

            } else {
                if (identifier.includes("@")) {
                    auth.signInWithEmailAndPassword(identifier, password).then((cred) => {
                        checkDatabaseRoleAndGo(cred.user.uid);
                    }).catch(err => alert("❌ Login Failed: " + err.message));
                } else {
                    db.collection("users").where("phoneNumber", "==", identifier).get().then(snapshot => {
                        if(snapshot.empty) { alert("❌ Phone number not registered!"); return; }
                        let userEmail = "";
                        snapshot.forEach(doc => { userEmail = doc.data().email; });
                        auth.signInWithEmailAndPassword(userEmail, password).then((cred) => {
                            checkDatabaseRoleAndGo(cred.user.uid);
                        }).catch(err => alert("❌ Password Incorrect!"));
                    });
                }
            }
        });

        function checkDatabaseRoleAndGo(uid) {
            db.collection("users").doc(uid).get().then(doc => {
                if(doc.exists) redirectUser(doc.data().role);
            });
        }

        function redirectUser(role) {
            if (role === 'customer') window.location.href = "customer.html";
            else if (role === 'supplier') window.location.href = "supplier.html";
        }
    </script>
</body>
</html>
