<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Multi-Auth Secure</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background-color: #121212; margin: 0; padding: 0; color: #fff; }
        .auth-container { max-width: 450px; margin: 30px auto; padding: 35px; background: #1e1e1e; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #333; box-sizing: border-box; }
        .logo { color: #ffcc00; margin: 0 0 5px 0; font-size: 32px; font-weight: 800; text-align: center; }
        .subtitle { color: #777; margin: 0 0 25px 0; font-size: 14px; text-align: center; }
        .social-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .social-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; transition: 0.2s; }
        .btn-google { background: #df4a32; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1 class="logo">QuickFix</h1>
        <p class="subtitle">ඔබේ ගිණුමට ඇතුල් වන්න</p>

        <div class="social-container">
            <button class="social-btn btn-google" onclick="loginWithGoogle()">🌐 Continue with Google</button>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq";
        const part2 = "_v--pAOOfI";
        
        const firebaseConfig = {
          apiKey: part1 + part2,
          authDomain: "quickfix-new.firebaseapp.com",
          projectId: "quickfix-new",
          storageBucket: "quickfix-new.firebasestorage.app",
          messagingSenderId: "316535009311",
          appId: "1:316535009311:web:975f6b2b89604447c0e52a"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    window.location.href = "customer.html";
                })
                .catch((error) => { alert("Google Sign-In Failed: " + error.message); });
        }
    </script>
</body>
</html>
