<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Customer Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* 🎨 THEME VARIABLES */
        :root {
            --bg-main: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --accent: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --input-bg: #252525;
            --sidebar-width: 260px;
        }

        [data-theme="light"] {
            --bg-main: #f5f6fa;
            --panel-bg: #ffffff;
            --border-color: #dddddd;
            --accent: #e6b800;
            --text-main: #222222;
            --text-muted: #666666;
            --input-bg: #f0f0f0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* 📁 SIDEBAR SYSTEM */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s, border 0.3s;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            text-align: center;
            margin-bottom: 30px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .menu-item {
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent);
            color: #111;
        }

        .logout-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .logout-btn:hover { background: #cc3333; }

        /* 💻 MAIN CONTENT CONTAINER */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 🎛️ TOP NAVIGATION BAR */
        .top-navbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            transition: background 0.3s, border 0.3s;
        }

        .theme-toggle-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .main-content {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        h2 {
            color: var(--accent);
            margin-top: 0;
            font-size: 28px;
            margin-bottom: 25px;
        }

        /* 👤 PROFILE VIEW STYLES */
        .profile-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* 💼 JOB POST FORM STYLES */
        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-main);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            font-size: 14px;
        }

        .btn-post {
            background: var(--accent);
            color: #111;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: 0.2s;
        }
        .btn-post:hover { opacity: 0.9; }

        /* 📋 JOB FEED LIST */
        .job-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 15px;
            max-width: 800px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .job-card h3 {
            margin: 0 0 10px 0;
            color: var(--accent);
            font-size: 20px;
        }

        .job-card p {
            margin: 0 0 12px 0;
            color: var(--text-main);
            line-height: 1.5;
        }

        .job-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">QuickFix</div>
            <ul class="menu-list">
                <li class="menu-item active" onclick="switchView('feed-view', this)">📋 මගේ Jobs ලිස්ට් එක</li>
                <li class="menu-item" onclick="switchView('post-view', this)">🛠️ අලුත් Job එකක් දාන්න</li>
                <li class="menu-item" onclick="switchView('profile-view', this)">👤 මගේ ප්‍රොෆයිල් එක</li>
            </ul>
        </div>
        <button class="logout-btn" onclick="logoutUser()">Log Out</button>
    </div>

    <div class="main-container">
        
        <div class="top-navbar">
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
            </button>
        </div>

        <div class="main-content">
            
            <div id="feed-view" class="view-section active">
                <h2>ඔබ පෝස්ට් කරපු Jobs</h2>
                <div id="jobsContainer">
                    <p style="color: var(--text-muted);">තාම කිසිම Job එකක් පෝස්ට් කරලා නැහැ...</p>
                </div>
            </div>

            <div id="post-view" class="view-section">
                <h2>අලුත් QuickFix වැඩක් පෝස්ට් කරන්න</h2>
                <div class="form-card">
                    <form id="jobPostForm">
                        <div class="form-group">
                            <label>වැඩේ මාතෘකාව (Title)</label>
                            <input type="text" id="jobTitle" placeholder="උදා: බයික් එකේ එන්ජින් ඔයිල් මාරු කරගන්න" required>
                        </div>
                        <div class="form-group">
                            <label>වැඩේ විස්තරය (Description)</label>
                            <textarea id="jobDesc" rows="4" placeholder="කරගන්න ඕනේ දේ පැහැදිලිව ලියන්න..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label>ඔබ දෙන මුදල (Budget - LKR)</label>
                            <input type="number" id="jobBudget" placeholder="රු. 1500" required>
                        </div>
                        <button type="submit" class="btn-post">Job එක පෝස්ට් කරන්න 🚀</button>
                    </form>
                </div>
            </div>

            <div id="profile-view" class="view-section">
                <h2>මගේ ගිණුමේ විස්තර</h2>
                <div class="profile-card">
                    <img id="userProfAvatar" class="profile-avatar" src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar">
                    <h3 id="userProfName" style="margin: 10px 0 5px 0; font-size: 22px;">ලෝඩ් වෙමින්...</h3>
                    <p id="userProfEmail" style="color: var(--text-muted); margin: 0 0 15px 0;">...</p>
                    <div style="font-size: 14px; font-weight: bold; color: var(--accent); background: var(--input-bg); padding: 8px; border-radius: 6px; display: inline-block;">🙋‍♂️ Account Role: Customer</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 🎯 Firebase Configuration (Split bypass fix included)
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq";
        const part2 = "_v--pAOOfI";
        
        const firebaseConfig = {
          apiKey: part1 + part2,
          authDomain: "quickfix-new.firebaseapp.com",
          projectId: "quickfix-new",
          storageBucket: "quickfix-new.firebasestorage.app",
          messagingSenderId: "316535009311",
          appId: "1:316535009311:web:975f6b2b89604447c0e52a"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 🌗 LIGHT MODE / DARK MODE FUNCTION
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let targetTheme = 'dark';

            if (currentTheme !== 'light') {
                targetTheme = 'light';
                document.getElementById('theme-icon').innerText = "☀️";
                document.getElementById('theme-text').innerText = "Light Mode";
            } else {
                targetTheme = 'dark';
                document.getElementById('theme-icon').innerText = "🌙";
                document.getElementById('theme-text').innerText = "Dark Mode";
            }

            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
        }

        // Apply saved theme on load
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        window.addEventListener('DOMContentLoaded', () => {
            if (savedTheme === 'light') {
                document.getElementById('theme-icon').innerText = "☀️";
                document.getElementById('theme-text').innerText = "Light Mode";
            }
        });

        // 🔄 VIEW SWITCHING LOGIC
        function switchView(viewId, element) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
        }

        // 👤 AUTH & REALTIME FIREBASE LOGIC
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "auth.html";
            } else {
                // Render Profile Data Safely
                document.getElementById('userProfName').innerText = user.displayName || "QuickFix User";
                document.getElementById('userProfEmail').innerText = user.email;
                if(user.photoURL) {
                    document.getElementById('userProfAvatar').src = user.photoURL;
                }

                // Load User's Posted Jobs dynamically from Firestore
                db.collection("jobs")
                  .where("customerId", "==", user.uid)
                  .orderBy("timestamp", "desc")
                  .onSnapshot(snapshot => {
                      const container = document.getElementById('jobsContainer');
                      if(snapshot.empty) {
                          container.innerHTML = `<p style="color: var(--text-muted);">තාම කිසිම Job එකක් පෝස්ට් කරලා නැහැ...</p>`;
                          return;
                      }
                      
                      container.innerHTML = "";
                      snapshot.forEach(doc => {
                          const job = doc.data();
                          container.innerHTML += `
                              <div class="job-card">
                                  <h3>${job.title}</h3>
                                  <p>${job.description}</p>
                                  <div style="font-weight: bold; color: var(--accent); font-size: 16px;">Budget: රු. ${job.budget}</div>
                                  <div class="job-meta">පෝස්ට් කලේ: ${job.timestamp ? new Date(job.timestamp.toDate()).toLocaleString() : "දැන්ම"}</div>
                              </div>
                          `;
                      });
                  }, error => {
                      console.log("Error loading jobs:", error.message);
                  });
            }
        });

        // 🚀 HANDLE JOB POSTING FORM TO FIRESTORE
        document.getElementById('jobPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) return;

            const title = document.getElementById('jobTitle').value;
            const description = document.getElementById('jobDesc').value;
            const budget = document.getElementById('jobBudget').value;

            db.collection("jobs").add({
                title: title,
                description: description,
                budget: budget,
                customerId: user.uid,
                customerName: user.displayName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("✅ Job එක සාර්ථකව පෝස්ට් කරා මචං!");
                document.getElementById('jobPostForm').reset();
                // Automatically switch back to feed view to see the new post
                switchView('feed-view', document.querySelectorAll('.menu-item')[0]);
            })
            .catch(err => alert("Error posting job: " + err.message));
        });

        // 🚪 LOGOUT FUNCTION
        function logoutUser() {
            auth.signOut().then(() => { window.location.href = "auth.html"; });
        }
    </script>
</body>
</html>
