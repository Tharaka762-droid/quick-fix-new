<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Customer Auth</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; margin: 0; padding: 0; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container { max-width: 450px; width: 100%; padding: 35px; background: #1e1e1e; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #333; box-sizing: border-box; text-align: center; position: relative; }
        .logo { color: #ffcc00; margin: 0 0 5px 0; font-size: 36px; font-weight: 800; }
        .subtitle { color: #777; margin: 0 0 25px 0; font-size: 14px; }
        
        .form-toggle { display: flex; justify-content: space-between; margin-bottom: 25px; background: #252525; padding: 5px; border-radius: 10px; border: 1px solid #333; }
        .tab-btn { width: 50%; padding: 12px; font-weight: bold; cursor: pointer; border: none; background: transparent; border-radius: 8px; font-size: 14px; color: #aaa; transition: 0.2s; }
        .tab-btn.active { background: #ffcc00; color: #111; }

        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #ffcc00; font-size: 13px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #2b2b2b; color: #fff; outline: none; }
        
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #111; background-color: #ffcc00; margin-top: 10px; }
        .divider { display: flex; align-items: center; text-align: center; color: #555; margin: 25px 0; font-size: 12px; font-weight: bold; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        
        .social-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; background: #df4a32; transition: 0.2s; }
        .hidden { display: none; }
        #loadingOverlay { display: none; color: #ffcc00; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1 class="logo">QuickFix</h1>
        <p class="subtitle" id="mainSubtitle">ඔබේ ගිණුමට ඇතුල් වන්න</p>
        
        <div id="loadingOverlay">මඳක් රැඳී සිටින්න... ⏳</div>

        <div class="form-toggle" id="tabBar">
            <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="signupTab" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="mainAuthForm">
            <div id="signupFields" class="hidden">
                <div class="input-group">
                    <label>ඔබේ සම්පූර්ණ නම</label>
                    <input type="text" id="authName" placeholder="Kamal Perera">
                </div>
                <div class="input-group">
                    <label>දුරකථන අංකය</label>
                    <input type="tel" id="authPhone" placeholder="07XXXXXXXX">
                </div>
            </div>

            <div class="input-group" id="identifierContainer">
                <label id="identifierLabel">ඊමේල් ලිපිනය (Email Address)</label>
                <input type="email" id="authIdentifier" placeholder="example@gmail.com" required>
            </div>
            
            <div class="input-group" id="passwordContainer">
                <label>මුරපදය (Password)</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ඇතුල් වන්න</button>
        </form>

        <div id="socialDiv">
            <div class="divider">නැතහොත් වෙනත් ක්‍රමයකින්</div>
            <button class="social-btn" onclick="loginWithGoogle()">🌐 Continue with Google</button>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq"; const part2 = "_v--pAOOfI";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "quickfix-new.firebaseapp.com", projectId: "quickfix-new" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let currentTab = 'login', checkLock = false;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('mainAuthForm').reset();
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('signupTab').classList.remove('active');
                document.getElementById('signupFields').classList.add('hidden');
                document.getElementById('mainSubtitle').innerText = "ඔබේ ආරක්ෂිත ගිණුමට ලොග් වන්න";
                document.getElementById('submitBtn').innerText = "ඇතුල් වන්න";
                document.getElementById('authPhone').removeAttribute('required');
            } else {
                document.getElementById('signupTab').classList.add('active');
                document.getElementById('loginTab').classList.remove('active');
                document.getElementById('signupFields').classList.remove('hidden');
                document.getElementById('mainSubtitle').innerText = "නව ගිණුමක් සාදා ඇතුල් වන්න";
                document.getElementById('submitBtn').innerText = "ගිණුම සාදන්න";
                document.getElementById('authPhone').setAttribute('required', 'required');
            }
        }

        // Auto Redirect On State Change
        auth.onAuthStateChanged((user) => {
            if (user && !checkLock) {
                checkLock = true;
                window.location.href = "customer.html";
            }
        });

        // ✅ FIXED WORKFLOW FOR GOOGLE AUTH SIGN-IN
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('loadingOverlay').style.display = 'block';
            
            auth.signInWithPopup(provider).then(async (result) => {
                // සැනින් Firestore එකේ කස්ටමර් ප්‍රොෆයිල් එකක් හදනවා Storage නැතුව
                await db.collection("users").doc(result.user.uid).set({
                    fullName: result.user.displayName,
                    email: result.user.email,
                    phoneNumber: result.user.phoneNumber || "නැත",
                    role: "customer",
                    avatar: result.user.photoURL || "https://www.w3schools.com/howto/img_avatar.png",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                window.location.href = "customer.html";
            }).catch((error) => { 
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Google Login Failed: " + error.message); 
            });
        }

        document.getElementById('mainAuthForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = "සකසමින් පවතිී... ⏳";
            btn.disabled = true;

            try {
                if (currentTab === 'signup') {
                    const name = document.getElementById('authName').value.trim();
                    const phone = document.getElementById('authPhone').value.trim();

                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    
                    await db.collection("users").doc(cred.user.uid).set({
                        fullName: name,
                        email: email,
                        phoneNumber: phone,
                        role: "customer",
                        avatar: "https://www.w3schools.com/howto/img_avatar.png",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("🎉 ගිණුම සාර්ථකව සාදන ලදී මචං!");
                    window.location.href = "customer.html";

                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    window.location.href = "customer.html";
                }
            } catch (err) {
                alert("❌ ක්‍රියාවලිය අසාර්ථකයි: " + err.message);
                btn.disabled = false;
                btn.innerText = (currentTab === 'login') ? "ඇතුල් වන්න" : "ගිණුම සාදන්න";
            }
        });
    </script>
</body>
</html>
