<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Customer Auth</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary-blue: #1a73e8;
            --hover-blue: #1557b0;
            --bg-light: #f8f9fa;
            --panel-white: #ffffff;
            --text-dark: #202124;
            --text-muted: #5f6368;
            --border-color: #dadce0;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, sans-serif; 
            background-color: var(--bg-light); 
            margin: 0; padding: 0; 
            color: var(--text-dark); 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; 
        }

        .auth-container { 
            max-width: 420px; width: 100%; 
            padding: 40px 30px; 
            background: var(--panel-white); 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); 
            border: 1px solid var(--border-color); 
            box-sizing: border-box; 
            text-align: center; 
        }

        .logo { 
            color: var(--primary-blue); 
            margin: 0 0 5px 0; 
            font-size: 38px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }

        .subtitle { 
            color: var(--text-muted); 
            margin: 0 0 30px 0; 
            font-size: 14px; 
            font-weight: 500;
        }
        
        .form-toggle { 
            display: flex; justify-content: space-between; 
            margin-bottom: 25px; 
            background: #f1f3f4; 
            padding: 4px; 
            border-radius: 10px; 
        }

        .tab-btn { 
            width: 50%; padding: 10px; 
            font-weight: bold; cursor: pointer; 
            border: none; background: transparent; 
            border-radius: 8px; font-size: 14px; 
            color: var(--text-muted); 
            transition: 0.2s ease; 
        }

        .tab-btn.active { 
            background: var(--panel-white); 
            color: var(--primary-blue); 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { 
            display: block; font-weight: 600; 
            margin-bottom: 6px; 
            color: var(--text-dark); 
            font-size: 13px; 
        }

        .input-group input { 
            width: 100%; padding: 12px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; box-sizing: border-box; 
            font-size: 14px; background: var(--panel-white); 
            color: var(--text-dark); outline: none; 
            transition: 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }
        
        .btn-submit { 
            width: 100%; padding: 14px; 
            border: none; border-radius: 8px; 
            font-size: 15px; font-weight: bold; 
            cursor: pointer; color: white; 
            background-color: var(--primary-blue); 
            margin-top: 10px; 
            transition: 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--hover-blue);
        }

        .divider { 
            display: flex; align-items: center; 
            text-align: center; color: var(--text-muted); 
            margin: 25px 0; font-size: 12px; 
            font-weight: 500; 
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        
        .social-btn { 
            width: 100%; padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; font-weight: bold; 
            font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            gap: 10px; color: var(--text-dark); 
            background: var(--panel-white); 
            transition: 0.2s ease; 
        }

        .social-btn:hover {
            background-color: #f1f3f4;
        }

        .hidden { display: none; }
        #loadingOverlay { display: none; color: var(--primary-blue); font-weight: bold; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1 class="logo">QuickFix</h1>
        <p class="subtitle" id="mainSubtitle">ඔබේ ගිණුමට ඇතුල් වන්න</p>
        
        <div id="loadingOverlay">මඳක් රැඳී සිටින්න... ⏳</div>

        <div class="form-toggle" id="tabBar">
            <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="signupTab" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="mainAuthForm">
            <div id="signupFields" class="hidden">
                <div class="input-group">
                    <label>ඔබේ සම්පූර්ණ නම</label>
                    <input type="text" id="authName" placeholder="Kamal Perera">
                </div>
                <div class="input-group">
                    <label>දුරකථන අංකය</label>
                    <input type="tel" id="authPhone" placeholder="07XXXXXXXX">
                </div>
            </div>

            <div class="input-group" id="identifierContainer">
                <label id="identifierLabel">ඊමේල් ලිපිනය (Email Address)</label>
                <input type="email" id="authIdentifier" placeholder="example@gmail.com" required>
            </div>
            
            <div class="input-group" id="passwordContainer">
                <label>මුරපදය (Password)</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ඇතුල් වන්න</button>
        </form>

        <div id="socialDiv">
            <div class="divider">නැතහොත් වෙනත් ක්‍රමයකින්</div>
            <button class="social-btn" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.47h4.84c-.21 1.12-.8 2.07-1.74 2.7v2.25h2.81c1.65-1.52 2.6-3.77 2.6-6.58z" fill="#4285F4"/><path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.82-2.25C11.36 14.17 9.94 14.5 9 14.5c-2.34 0-4.32-1.58-5.03-3.71H1.08v2.32C2.56 16.03 5.56 18 9 18z" fill="#34A853"/><path d="M3.97 10.79c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V5.07H1.08C.39 6.45 0 8.01 0 9s.39 2.55 1.08 3.93l2.89-2.14z" fill="#FBBC05"/><path d="M9 3.5c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46 1.02 11.42 0 9 0 5.56 0 2.56 1.97 1.08 4.93l2.89 2.14c.71-2.13 2.69-3.71 5.03-3.71z" fill="#EA4335"/></svg>
                Continue with Google
            </button>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq"; const part2 = "_v--pAOOfI";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "quickfix-new.firebaseapp.com", projectId: "quickfix-new" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let currentTab = 'login', checkLock = false;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('mainAuthForm').reset();
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('signupTab').classList.remove('active');
                document.getElementById('signupFields').classList.add('hidden');
                document.getElementById('mainSubtitle').innerText = "ඔබේ ආරක්ෂිත ගිණුමට ලොග් වන්න";
                document.getElementById('submitBtn').innerText = "ඇතුල් වන්න";
                document.getElementById('authPhone').removeAttribute('required');
            } else {
                document.getElementById('signupTab').classList.add('active');
                document.getElementById('loginTab').classList.remove('active');
                document.getElementById('signupFields').classList.remove('hidden');
                document.getElementById('mainSubtitle').innerText = "නව ගිණුමක් සාදා ඇතුල් වන්න";
                document.getElementById('submitBtn').innerText = "ගිණුම සාදන්න";
                document.getElementById('authPhone').setAttribute('required', 'required');
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user && !checkLock) {
                checkLock = true;
                window.location.href = "customer.html";
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('loadingOverlay').style.display = 'block';
            
            auth.signInWithPopup(provider).then(async (result) => {
                await db.collection("users").doc(result.user.uid).set({
                    fullName: result.user.displayName,
                    email: result.user.email,
                    phoneNumber: result.user.phoneNumber || "නැත",
                    role: "customer",
                    avatar: result.user.photoURL || "https://www.w3schools.com/howto/img_avatar.png",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                window.location.href = "customer.html";
            }).catch((error) => { 
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Google Login Failed: " + error.message); 
            });
        }

        document.getElementById('mainAuthForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value;
            const btn = document.getElementById('submitBtn');

            btn.innerText = "සකසමින් පවතිී... ⏳";
            btn.disabled = true;

            try {
                if (currentTab === 'signup') {
                    const name = document.getElementById('authName').value.trim();
                    const phone = document.getElementById('authPhone').value.trim();

                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    
                    await db.collection("users").doc(cred.user.uid).set({
                        fullName: name,
                        email: email,
                        phoneNumber: phone,
                        role: "customer",
                        avatar: "https://www.w3schools.com/howto/img_avatar.png",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("🎉 ගිණුම සාර්ථකව සාදන ලදී මචං!");
                    window.location.href = "customer.html";

                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                    window.location.href = "customer.html";
                }
            } catch (err) {
                alert("❌ ක්‍රියාවලිය අසාර්ථකයි: " + err.message);
                btn.disabled = false;
                btn.innerText = (currentTab === 'login') ? "ඇතුල් වන්න" : "ගිණුම සාදන්න";
            }
        });
    </script>
</body>
</html>
