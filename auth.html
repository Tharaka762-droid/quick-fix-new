<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Multi-Auth Secure</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; margin: 0; padding: 0; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-container { max-width: 450px; width: 100%; padding: 35px; background: #1e1e1e; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #333; box-sizing: border-box; text-align: center; }
        .logo { color: #ffcc00; margin: 0 0 5px 0; font-size: 36px; font-weight: 800; }
        .subtitle { color: #777; margin: 0 0 25px 0; font-size: 14px; }
        
        /* 🎛️ TAB BUTTONS */
        .form-toggle { display: flex; justify-content: space-between; margin-bottom: 25px; background: #252525; padding: 5px; border-radius: 10px; border: 1px solid #333; }
        .tab-btn { width: 50%; padding: 12px; font-weight: bold; cursor: pointer; border: none; background: transparent; border-radius: 8px; font-size: 14px; color: #aaa; transition: 0.2s; }
        .tab-btn.active { background: #ffcc00; color: #111; }

        /* 📋 INPUT FIELDS */
        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #ffcc00; font-size: 13px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #2b2b2b; color: #fff; outline: none; }
        
        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #111; background-color: #ffcc00; margin-top: 10px; }
        .divider { display: flex; align-items: center; text-align: center; color: #555; margin: 25px 0; font-size: 12px; font-weight: bold; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        
        .social-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; background: #df4a32; transition: 0.2s; }
        .social-btn:hover { opacity: 0.9; }

        /* 🙋‍♂️ ROLE SELECTOR FOR SIGNUP */
        .role-area { display: none; margin-top: 15px; text-align: left; }
        .role-selector { display: flex; justify-content: space-between; gap: 15px; margin: 10px 0 20px 0; }
        .role-box { width: 50%; padding: 15px 10px; border: 2px solid #444; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; background: #2b2b2b; color: #aaa; text-align: center; }
        .role-box.active { border-color: #ffcc00; background: #221f15; color: #ffcc00; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1 class="logo">QuickFix</h1>
        <p class="subtitle" id="mainSubtitle">ඔබේ ගිණුමට ඇතුල් වන්න හෝ අලුතින් සාදන්න</p>

        <div class="form-toggle" id="tabBar">
            <button id="loginTab" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="signupTab" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <form id="mainAuthForm">
            <div id="signupFields" class="hidden">
                <div class="input-group">
                    <label>ඔබේ සම්පූර්ණ නම</label>
                    <input type="text" id="authName" placeholder="Kamal Perera">
                </div>
                <div class="input-group">
                    <label>දුරකථන අංකය (Phone Number)</label>
                    <input type="tel" id="authPhone" placeholder="07XXXXXXXX">
                </div>
            </div>

            <div class="input-group">
                <label id="identifierLabel">ඊමේල් ලිපිනය (Email)</label>
                <input type="text" id="authIdentifier" placeholder="example@gmail.com" required>
            </div>
            
            <div class="input-group">
                <label>මුරපදය (Password)</label>
                <input type="password" id="authPassword" placeholder="••••••••" required>
            </div>

            <div id="roleArea" class="role-area">
                <label style="color: #ffcc00; font-weight: bold;">ඔබේ භූමිකාව තෝරන්න (Select Role):</label>
                <div class="role-selector">
                    <div id="roleCust" class="role-box active" onclick="selectRole('customer')">🙋‍♂️ කස්ටමර්</div>
                    <div id="roleSupp" class="role-box" onclick="selectRole('supplier')">🛠️ රයිඩර්</div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ඇතුල් වන්න</button>
        </form>

        <div id="socialDiv">
            <div class="divider">නැතහොත් වෙනත් ක්‍රමයකින්</div>
            <button class="social-btn" onclick="loginWithGoogle()">🌐 Continue with Google</button>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq"; const part2 = "_v--pAOOfI";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "quickfix-new.firebaseapp.com", projectId: "quickfix-new", storageBucket: "quickfix-new.firebasestorage.app", messagingSenderId: "316535009311", appId: "1:316535009311:web:975f6b2b89604447c0e52a" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let currentTab = 'login', chosenRole = 'customer', googleUserObj = null;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('mainAuthForm').reset();
            document.getElementById('roleArea').style.display = 'none';
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('signupTab').classList.remove('active');
                document.getElementById('signupFields').classList.add('hidden');
                document.getElementById('identifierLabel').innerText = "ඊමේල් හෝ දුරකථන අංකය (Email or Phone)";
                document.getElementById('authIdentifier').placeholder = "example@gmail.com / 07XXXXXXXX";
                document.getElementById('submitBtn').innerText = "ඇතුල් වන්න";
                document.getElementById('socialDiv').style.display = 'block';
            } else {
                document.getElementById('signupTab').classList.add('active');
                document.getElementById('loginTab').classList.remove('active');
                document.getElementById('signupFields').classList.remove('hidden');
                document.getElementById('identifierLabel').innerText = "ඊමේල් ලිපිනය (Email)";
                document.getElementById('authIdentifier').placeholder = "example@gmail.com";
                document.getElementById('roleArea').style.display = 'block';
                document.getElementById('submitBtn').innerText = "ගිණුම සාදන්න";
            }
        }
        // Initialize setup for login layout defaults
        switchTab('login');

        function selectRole(role) {
            chosenRole = role;
            document.getElementById('roleCust').classList.remove('active');
            document.getElementById('roleSupp').classList.remove('active');
            if (role === 'customer') document.getElementById('roleCust').classList.add('active');
            else document.getElementById('roleSupp').classList.add('active');
        }

        // 🌐 GOOGLE AUTH LOGIN FLUIDITY
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                googleUserObj = result.user;
                db.collection("users").doc(googleUserObj.uid).get().then((doc) => {
                    if (doc.exists) {
                        redirectUser(doc.data().role);
                    } else {
                        document.getElementById('loginArea')?.classList.add('hidden');
                        document.getElementById('tabBar').classList.add('hidden');
                        document.getElementById('socialDiv').style.display = 'none';
                        document.getElementById('signupFields').classList.add('hidden');
                        document.getElementById('authIdentifier').parentElement.classList.add('hidden');
                        document.getElementById('authPassword').parentElement.classList.add('hidden');
                        document.getElementById('roleArea').style.display = 'block';
                        document.getElementById('submitBtn').innerText = "ලියාපදිංචිය අවසන් කරන්න";
                        currentTab = 'google-new-role';
                    }
                });
            }).catch((error) => { alert("Google Login Failed: " + error.message); });
        }

        // 📝 FORM SUBMISSION Logic (Handles Email/Phone Logins and Signups)
        document.getElementById('mainAuthForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let identifier = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value;

            if (currentTab === 'signup') {
                const name = document.getElementById('authName').value;
                const phone = document.getElementById('authPhone').value.trim();

                if(!identifier.includes("@")) { alert("කරුණාකර නිවැරදි ඊමේල් ලිපිනයක් ඇතුළත් කරන්න!"); return; }
                if(!phone) { alert("කරුණාකර දුරකථන අංකයක් ඇතුළත් කරන්න!"); return; }

                auth.createUserWithEmailAndPassword(identifier, password).then((cred) => {
                    return db.collection("users").doc(cred.user.uid).set({
                        fullName: name, email: identifier, phoneNumber: phone, role: chosenRole,
                        avatar: "https://www.w3schools.com/howto/img_avatar.png",
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }).then(() => {
                    alert("🎉 ගිණුම සාර්ථකව සැදුණා! දැන් Login ටැබ් එකෙන් ලොග් වන්න මචං.");
                    switchTab('login');
                }).catch(err => alert("Error: " + err.message));

            } else if (currentTab === 'google-new-role') {
                // Submit logic for new Google users picking role
                db.collection("users").doc(googleUserObj.uid).set({
                    fullName: googleUserObj.displayName, email: googleUserObj.email, phoneNumber: "Google Verified", role: chosenRole,
                    avatar: googleUserObj.photoURL || "https://www.w3schools.com/howto/img_avatar.png",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => { redirectUser(chosenRole); });

            } else {
                // 🔐 LOGIN PROCESS (Email or Phone Number support)
                if (identifier.includes("@")) {
                    // Direct Email sign in
                    auth.signInWithEmailAndPassword(identifier, password).then((cred) => {
                        checkDatabaseRoleAndGo(cred.user.uid);
                    }).catch(err => alert("❌ Login සක්‍රීය නැත: " + err.message));
                } else {
                    // Phone Number Sign In mapping logic
                    db.collection("users").where("phoneNumber", "==", identifier).get().then(snapshot => {
                        if(snapshot.empty) { alert("❌ මෙම දුරකථන අංකය ලියාපදිංචි කර නැත!"); return; }
                        let userEmail = "";
                        snapshot.forEach(doc => { userEmail = doc.data().email; });
                        
                        auth.signInWithEmailAndPassword(userEmail, password).then((cred) => {
                            checkDatabaseRoleAndGo(cred.user.uid);
                        }).catch(err => alert("❌ මුරපදය වැරදියි!"));
                    });
                }
            }
        });

        function checkDatabaseRoleAndGo(uid) {
            db.collection("users").doc(uid).get().then(doc => {
                if(doc.exists) redirectUser(doc.data().role);
            });
        }

        function redirectUser(role) {
            if (role === 'customer') window.location.href = "customer.html";
            else if (role === 'supplier') window.location.href = "supplier.html";
        }
    </script>
</body>
</html>
