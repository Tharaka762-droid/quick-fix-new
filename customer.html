<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Customer Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --accent: #ffcc00;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --input-bg: #252525;
            --sidebar-width: 260px;
        }
        [data-theme="light"] {
            --bg-main: #f5f6fa;
            --panel-bg: #ffffff;
            --border-color: #dddddd;
            --accent: #e6b800;
            --text-main: #222222;
            --text-muted: #666666;
            --input-bg: #f0f0f0;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        .sidebar {
            width: var(--sidebar-width); background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color); display: flex;
            flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box;
        }
        .brand { font-size: 26px; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 30px; }
        .menu-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .menu-item {
            padding: 14px 18px; border-radius: 10px; margin-bottom: 8px; cursor: pointer;
            font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .menu-item:hover, .menu-item.active { background-color: var(--accent); color: #111; }
        .logout-btn { background: #ff4444; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        .top-navbar { background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; display: flex; justify-content: flex-end; align-items: center; }
        .theme-toggle-btn { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; box-sizing: border-box; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        h2 { color: var(--accent); margin-top: 0; font-size: 28px; }
        .form-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); box-sizing: border-box; outline: none;
        }
        /* 🗺️ MAP BOX STYLE */
        #map { width: 100%; height: 250px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border-color); z-index: 1; }
        .btn-post { background: var(--accent); color: #111; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        .job-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 22px; border-radius: 12px; margin-bottom: 15px; max-width: 800px; }
        .job-card h3 { margin: 0 0 10px 0; color: var(--accent); }
        .profile-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; max-width: 450px; text-align: center; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">QuickFix</div>
            <ul class="menu-list">
                <li class="menu-item active" onclick="switchView('feed-view', this)">📋 මගේ Jobs ලිස්ට් එක</li>
                <li class="menu-item" onclick="switchView('post-view', this)">🛠️ අලුත් Job එකක් දාන්න</li>
                <li class="menu-item" onclick="switchView('profile-view', this)">👤 මගේ ප්‍රොෆයිල් එක</li>
            </ul>
        </div>
        <button class="logout-btn" onclick="logoutUser()">Log Out</button>
    </div>

    <div class="main-container">
        <div class="top-navbar">
            <button class="theme-toggle-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span></button>
        </div>

        <div class="main-content">
            <div id="feed-view" class="view-section active">
                <h2>ඔබ පෝස්ට් කරපු Jobs</h2>
                <div id="jobsContainer"></div>
            </div>

            <div id="post-view" class="view-section">
                <h2>අලුත් QuickFix වැඩක් පෝස්ට් කරන්න</h2>
                <div class="form-card">
                    <form id="jobPostForm">
                        <div class="form-group">
                            <label>වැඩේ මාතෘකාව (Title)</label>
                            <input type="text" id="jobTitle" placeholder="උදා: බඩු වගයක් ඩිලිවරි කරගන්න" required>
                        </div>
                        <div class="form-group">
                            <label>වැඩේ විස්තරය (Description)</label>
                            <textarea id="jobDesc" rows="3" placeholder="කරගන්න ඕනේ දේ ලියන්න..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label>ඔබ ඉන්න තැන පින් කරන්න (Pin Location)📍</label>
                            <div id="map"></div>
                            <input type="hidden" id="latInput"><input type="hidden" id="lngInput">
                        </div>
                        <div class="form-group">
                            <label>ඔබ දෙන මුදල (Budget - LKR)</label>
                            <input type="number" id="jobBudget" placeholder="රු. 1500" required>
                        </div>
                        <button type="submit" class="btn-post">Job එක පෝස්ට් කරන්න 🚀</button>
                    </form>
                </div>
            </div>

            <div id="profile-view" class="view-section">
                <h2>මගේ ගිණුමේ විස්තර</h2>
                <div class="profile-card">
                    <img id="userProfAvatar" class="profile-avatar" src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar">
                    <h3 id="userProfName">ලෝඩ් වෙමින්...</h3>
                    <p id="userProfEmail">...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq"; const part2 = "_v--pAOOfI";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "quickfix-new.firebaseapp.com", projectId: "quickfix-new", storageBucket: "quickfix-new.firebasestorage.app", messagingSenderId: "316535009311", appId: "1:316535009311:web:975f6b2b89604447c0e52a" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let map, marker;

        function initMap() {
            // Default Sri Lanka location (Colombo area)
            map = L.map('map').setView([6.9271, 79.8612], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            
            marker = L.marker([6.9271, 79.8612], {draggable: true}).addTo(map);
            
            // Update inputs when pin moves
            marker.on('dragend', function (e) {
                let position = marker.getLatLng();
                document.getElementById('latInput').value = position.lat;
                document.getElementById('lngInput').value = position.lng;
            });

            // Try to get live phone GPS location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude, lng = pos.coords.longitude;
                    map.setView([lat, lng], 15);
                    marker.setLatLng([lat, lng]);
                    document.getElementById('latInput').value = lat;
                    document.getElementById('lngInput').value = lng;
                });
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            let target = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', target);
            document.getElementById('theme-icon').innerText = target === 'light' ? "☀️" : "🌙";
            localStorage.setItem('theme', target);
        }

        function switchView(viewId, element) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
            if(viewId === 'post-view' && !map) { setTimeout(initMap, 200); }
        }

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "auth.html"; }
            else {
                document.getElementById('userProfName').innerText = user.displayName || "QuickFix User";
                document.getElementById('userProfEmail').innerText = user.email;
                if(user.photoURL) document.getElementById('userProfAvatar').src = user.photoURL;

                db.collection("jobs").where("customerId", "==", user.uid).orderBy("timestamp", "desc").onSnapshot(snapshot => {
                    const container = document.getElementById('jobsContainer');
                    if(snapshot.empty) { container.innerHTML = `<p style='color:var(--text-muted)'>තාම කිසිම Job එකක් පෝස්ට් කරලා නැහැ...</p>`; return; }
                    container.innerHTML = "";
                    snapshot.forEach(doc => {
                        const job = doc.data();
                        container.innerHTML += `
                            <div class="job-card">
                                <h3>${job.title}</h3>
                                <p>${job.description}</p>
                                <div style="font-weight:bold;color:var(--accent)">Budget: රු. ${job.budget}</div>
                                <div style="font-size:12px;margin-top:5px;color:gray">ලොකේෂන්: ${job.lat ? "📌 පින් කර ඇත" : "නැත"}</div>
                            </div>`;
                    });
                });
            }
        });

        document.getElementById('jobPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = auth.currentUser;
            db.collection("jobs").add({
                title: document.getElementById('jobTitle').value,
                description: document.getElementById('jobDesc').value,
                budget: document.getElementById('jobBudget').value,
                lat: parseFloat(document.getElementById('latInput').value) || 6.9271,
                lng: parseFloat(document.getElementById('lngInput').value) || 79.8612,
                customerId: user.uid,
                customerName: user.displayName,
                status: "available",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("✅ Job එක ලොකේෂන් එකත් එක්කම පෝස්ට් කරා මචං!");
                document.getElementById('jobPostForm').reset();
                switchView('feed-view', document.querySelectorAll('.menu-item')[0]);
            });
        });

        function logoutUser() { auth.signOut().then(() => { window.location.href = "auth.html"; }); }
    </script>
</body>
</html>
