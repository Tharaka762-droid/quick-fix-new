<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Rider Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #121212; --panel-bg: #1e1e1e; --border-color: #333333; --accent: #ffcc00; --text-main: #ffffff; --text-muted: #aaaaaa; --input-bg: #252525; --sidebar-width: 260px;
        }
        [data-theme="light"] {
            --bg-main: #f5f6fa; --panel-bg: #ffffff; --border-color: #dddddd; --accent: #e6b800; --text-main: #222222; --text-muted: #666666; --input-bg: #f0f0f0;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: var(--sidebar-width); background-color: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .brand { font-size: 26px; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 30px; }
        .menu-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
        .menu-item { padding: 14px 18px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
        .menu-item:hover, .menu-item.active { background-color: var(--accent); color: #111; }
        .logout-btn { background: #ff4444; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; }
        .top-navbar { background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; display: flex; justify-content: flex-end; align-items: center; }
        .theme-toggle-btn { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; box-sizing: border-box; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        h2 { color: var(--accent); margin-top: 0; font-size: 28px; }
        .job-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 22px; border-radius: 12px; margin-bottom: 15px; max-width: 800px; }
        .job-card h3 { margin: 0 0 10px 0; color: var(--accent); }
        .job-img { width: 100%; max-width: 300px; height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border-color); }
        .job-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
        .btn-accept { background: var(--accent); color: #111; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .workspace-box { display: flex; gap: 20px; max-width: 1000px; margin-top: 15px; }
        #riderMap { width: 50%; height: 350px; border-radius: 8px; border: 1px solid var(--border-color); }
        .chat-panel { width: 50%; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; height: 350px; overflow: hidden; }
        .chat-messages { flex-grow: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 9px; border-radius: 8px; max-width: 75%; font-size: 13px; }
        .msg.sent { background: var(--accent); color: #111; align-self: flex-end; }
        .msg.received { background: var(--input-bg); color: var(--text-main); align-self: flex-start; }
        .chat-input-area { display: flex; border-top: 1px solid var(--border-color); }
        .chat-input-area input { flex-grow: 1; border: none; padding: 12px; background: transparent; color: var(--text-main); outline: none; }
        .chat-input-area button { background: var(--accent); border: none; padding: 0 15px; font-weight: bold; color: #111; cursor: pointer; }

        .otp-verify-area { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-top: 15px; max-width: 400px; }
        .otp-verify-area input { padding: 10px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; width: 120px; text-align: center; font-size: 16px; outline: none; font-weight: bold; }

        .profile-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 35px; border-radius: 16px; max-width: 450px; text-align: center; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand">QuickFix</div>
            <ul class="menu-list">
                <li class="menu-item active" onclick="switchView('pool-view', this)">🛠️ ලද හැකි Jobs (Job Pool)</li>
                <li class="menu-item" onclick="switchView('my-jobs-view', this)">✅ මම බාරගත් Jobs</li>
                <li class="menu-item" onclick="switchView('profile-view', this)">👤 මගේ ප්‍රොෆයිල් එක</li>
            </ul>
        </div>
        <button class="logout-btn" onclick="logoutUser()">Log Out</button>
    </div>

    <div class="main-container">
        <div class="top-navbar">
            <button class="theme-toggle-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span></button>
        </div>

        <div class="main-content">
            <div id="pool-view" class="view-section active">
                <h2>ලද හැකි QuickFix Jobs</h2>
                <div id="availableJobsContainer"></div>
            </div>

            <div id="my-jobs-view" class="view-section">
                <h2>ඔබ දැනට බාරගෙන ඇති Jobs</h2>
                <div id="acceptedJobsContainer"></div>
                
                <div id="navigationArea" style="display: none;">
                    <div class="workspace-box">
                        <div id="riderMap"></div>
                        <div class="chat-panel">
                            <div style="background:var(--accent);color:#111;padding:10px;font-weight:bold;">💬 පාරිභෝගිකයා සමඟ ලයිව් චැට්</div>
                            <div id="riderChatMessages" class="chat-messages"></div>
                            <form id="riderChatForm" class="chat-input-area">
                                <input type="text" id="riderChatMsgInput" placeholder="මැසේජ් එකක් යවන්න..." required autocomplete="off">
                                <button type="submit">යවන්න</button>
                            </form>
                        </div>
                    </div>

                    <div class="otp-verify-area">
                        <h4 style="margin:0 0 10px 0; color:var(--accent);">වැඩේ ඉවර කරන්න කස්ටමර්ගේ OTP එක ගහන්න 🔐</h4>
                        <input type="number" id="inputOtpCheck" placeholder="XXXX">
                        <button class="btn-accept" style="padding:10px 15px; margin-left:10px;" onclick="completeJobWithOTP()">OTP Verify කර වැඩේ අවසන් කරන්න</button>
                    </div>
                </div>
            </div>

            <div id="profile-view" class="view-section">
                <h2>මගේ ගිණුමේ විස්තර</h2>
                <div class="profile-card">
                    <img id="userProfAvatar" class="profile-avatar" src="https://www.w3schools.com/howto/img_avatar.png" alt="Avatar">
                    <h3 id="userProfName" style="margin: 10px 0 5px 0; font-size: 24px;">ලෝඩ් වෙමින්...</h3>
                    <p id="userProfEmail" style="color: var(--text-muted); margin: 0 0 15px 0;">...</p>
                    <div style="font-size: 14px; font-weight: bold; color: var(--accent); background: var(--input-bg); padding: 8px 15px; border-radius: 6px; display: inline-block;">🛠️ Account Role: Rider / Rider</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const part1 = "AIzaSyD29G6zoTAbg1YybqIWdKzCq"; const part2 = "_v--pAOOfI";
        const firebaseConfig = { apiKey: part1 + part2, authDomain: "quickfix-new.firebaseapp.com", projectId: "quickfix-new", storageBucket: "quickfix-new.appspot.com", messagingSenderId: "316535009311", appId: "1:316535009311:web:975f6b2b89604447c0e52a" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let rMap, rMarker, activeJobId = null, chatListener = null, activeJobRealOTP = null;

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            let target = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', target);
            document.getElementById('theme-icon').innerText = target === 'light' ? "☀️" : "🌙";
        }

        function switchView(viewId, element) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
        }

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "auth.html"; }
            else {
                document.getElementById('userProfName').innerText = user.displayName || "QuickFix Rider";
                document.getElementById('userProfEmail').innerText = user.email;
                if(user.photoURL) document.getElementById('userProfAvatar').src = user.photoURL;

                db.collection("jobs").where("status", "==", "available").onSnapshot(snapshot => {
                    const container = document.getElementById('availableJobsContainer');
                    if(snapshot.empty) { container.innerHTML = "<p style='color:var(--text-muted)'>මේ වෙලාවේ වෙනත් Jobs කිසිවක් නැත...</p>"; return; }
                    container.innerHTML = "";
                    snapshot.forEach(doc => {
                        const job = doc.data();
                        let jobImgTag = job.imageUrl ? `<img src="${job.imageUrl}" class="job-img" alt="Job Image">` : '';
                        container.innerHTML += `
                            <div class="job-card">
                                <h3>${job.title}</h3>
                                <p>${job.description}</p>
                                ${jobImgTag}
                                <div class="job-footer"><div style="font-weight:bold;color:var(--accent); margin-top:5px;">රු. ${job.budget}</div>
                                <button class="btn-accept" onclick="acceptJob('${doc.id}')">Job එක බාරගන්න 🤝</button></div>
                            </div>`;
                    });
                });

                db.collection("jobs").where("riderId", "==", user.uid).where("status", "==", "accepted").onSnapshot(snapshot => {
                    const container = document.getElementById('acceptedJobsContainer');
                    if(snapshot.empty) { container.innerHTML = "<p style='color:var(--text-muted)'>ඔබ දැනට කිසිම වැඩක් බාරගෙන නැත...</p>"; document.getElementById('navigationArea').style.display = "none"; return; }
                    container.innerHTML = "";
                    snapshot.forEach(doc => {
                        const job = doc.data();
                        activeJobId = doc.id;
                        activeJobRealOTP = job.otpCode;
                        container.innerHTML += `<div class="job-card" style="border-left:4px solid #00c851"><h3>${job.title}</h3><p>පාරිභෝගිකයා: ${job.customerName}</p></div>`;
                        
                        document.getElementById('navigationArea').style.display = "block";
                        setTimeout(() => { showNavigationMap(job.lat, job.lng); }, 300);
                        listenToRiderChat(doc.id);
                    });
                });
            }
        });

        function listenToRiderChat(jobId) {
            const msgContainer = document.getElementById('riderChatMessages');
            if(chatListener) chatListener();
            chatListener = db.collection("jobs").doc(jobId).collection("messages").orderBy("timestamp", "asc").onSnapshot(snapshot => {
                msgContainer.innerHTML = "";
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    let msgClass = msg.senderId === auth.currentUser.uid ? 'sent' : 'received';
                    msgContainer.innerHTML += `<div class="msg ${msgClass}">${msg.text}</div>`;
                });
                msgContainer.scrollTop = msgContainer.scrollHeight;
            });
        }

        document.getElementById('riderChatForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('riderChatMsgInput');
            db.collection("jobs").doc(activeJobId).collection("messages").add({
                text: input.value.trim(), senderId: auth.currentUser.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { input.value = ""; });
        });

        function acceptJob(jobId) {
            db.collection("jobs").doc(jobId).update({
                riderId: auth.currentUser.uid, riderName: auth.currentUser.displayName, status: "accepted"
            }).then(() => { switchView('my-jobs-view', document.querySelectorAll('.menu-item')[1]); });
        }

        function showNavigationMap(lat, lng) {
            if (!rMap) {
                rMap = L.map('riderMap').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(rMap);
                rMarker = L.marker([lat, lng]).addTo(rMap);
            } else { rMap.setView([lat, lng], 15); rMarker.setLatLng([lat, lng]); }
        }

        function completeJobWithOTP() {
            const typedOTP = document.getElementById('inputOtpCheck').value;
            if(parseInt(typedOTP) !== parseInt(activeJobRealOTP)) {
                alert("❌ වැරදි OTP කේතයක්!");
                return;
            }
            db.collection("jobs").doc(activeJobId).update({ status: "completed" }).then(() => {
                alert("✅ වැඩේ අවසන් කරා මචං!");
                document.getElementById('inputOtpCheck').value = "";
                document.getElementById('navigationArea').style.display = "none";
                switchView('pool-view', document.querySelectorAll('.menu-item')[0]);
            });
        }

        function logoutUser() { auth.signOut().then(() => { window.location.href = "auth.html"; }); }
    </script>
</body>
</html>
