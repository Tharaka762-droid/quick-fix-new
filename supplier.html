<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickFix - Supplier Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fc; margin: 0; padding: 0; }
        header { background: #1a1a1a; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; }
        .logo { color: #ffcc00; }
        .booking-section { padding: 40px 20px; display: flex; justify-content: center; }
        .form-container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .task-card { background: #fff; border-left: 5px solid #ffcc00; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: left; border: 1px solid #eee; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .urgency-badge { background: #ff4d4d; color: white; padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .budget-tag { font-size: 18px; font-weight: bold; color: #2ecc71; }
        .btn-accept { background-color: #1a1a1a; color: #ffcc00; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-accepted { background-color: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #f7f9fc;">

    <header>
        <div class="logo">QuickFix Rider</div>
        <div style="color: #2ecc71; font-size:16px;" id="welcomeRider">● Active Dashboard</div>
    </header>

    <section class="booking-section">
        <div class="form-container">
            <h2>දැනට ඇති හදිසි අවශ්‍යතා 🛠️</h2>
            <div id="taskList">
                <p style="color: #888; text-align: center;">නව හදිසි අවශ්‍යතා සෙමින් පවතී...</p>
            </div>
        </div>
    </section>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD29G6zoTABg1YybqIWdKzCq_v--pA0oFI",
          authDomain: "quickfix-new.firebaseapp.com",
          projectId: "quickfix-new",
          storageBucket: "quickfix-new.firebasestorage.app",
          messagingSenderId: "316535009311",
          appId: "1:316535009311:web:975f6b2b89604447c0e52a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🚀 LocalStorage එකෙන් රයිඩර්ගේ නම සහ නම්බර් එක නිවැරදිව ලබාගැනීම
        let riderRealName = localStorage.getItem("fullName") || "Madushan";
        let riderRealPhone = localStorage.getItem("phoneNumber") || "0755191747";
        document.getElementById('welcomeRider').innerText = `🛠️ ${riderRealName} (${riderRealPhone})`;

        // සජීවීව ජොබ් ලිස්ට් එක පෙන්වීම
        db.collection("tasks").orderBy("createdAt", "desc").onSnapshot((querySnapshot) => {
            const taskListContainer = document.getElementById('taskList');
            taskListContainer.innerHTML = "";

            if (querySnapshot.empty) {
                taskListContainer.innerHTML = `<p style="color: #888; text-align: center;">නව හදිසි අවශ්‍යතා සෙමින් පවතී...</p>`;
                return;
            }

            querySnapshot.forEach((doc) => {
                const task = doc.data();
                const taskId = doc.id;
                const taskCard = document.createElement('div');
                taskCard.className = 'task-card';
                
                let actionButton = `<button class="btn-accept" onclick="acceptTask('${taskId}')">වැඩේ බාරගන්න (Accept)</button>`;
                let riderStatus = '';

                if (task.status === 'accepted') {
                    actionButton = `<button class="btn-accepted" disabled>බාරගෙන ඇත ✅</button>`;
                    riderStatus = `<p style="color: #2ecc71; font-weight: bold;">👤 බාරගත් සපයන්නා: ${task.riderName} (${task.riderPhone})</p>`;
                }
                
                taskCard.innerHTML = `
                    <div class="task-header">
                        <h3>🔔 ${task.title}</h3>
                        <span class="urgency-badge">${task.urgency}</span>
                    </div>
                    <p><b>විස්තර:</b> ${task.description}</p>
                    <p><b>📍 ස්ථානය:</b> ${task.location}</p>
                    <p><b>👤 කස්ටමර්:</b> ${task.customerName} | <b>📞 දුරකථන:</b> ${task.customerPhone}</p>
                    ${riderStatus}
                    <div class="task-header" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                        <span class="budget-tag">රු. ${task.budget}</span>
                        ${actionButton}
                    </div>
                `;
                taskListContainer.appendChild(taskCard);
            });
        });

        function acceptTask(id) {
            const riderMapLink = prompt("ඔබ දැනට සිටින ස්ථානය හෝ ලයිව් ලොකේෂන් ලින්ක් එක ඇතුලත් කරන්න:");
            
            if (riderMapLink != null && riderMapLink != "") {
                db.collection("tasks").doc(id).update({
                    status: "accepted",
                    riderName: riderRealName,       
                    riderPhone: riderRealPhone,     // 🚀 මෙතනට දැන් සැබෑ නම්බර් එකම වැටෙනවා
                    riderLocation: riderMapLink
                })
                .then(() => {
                    alert("වැඩේ සාර්ථකව බාරගත්තා!");
                });
            }
        }
    </script>
</body>
</html>
